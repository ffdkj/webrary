<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>BookReader - 书架</title>
  <meta name="theme-color" content="#050816">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Webrary">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/webrary.svg">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/pwa.js" defer></script>
</head>
<body>

  <!-- ============ 认证页面（登录/注册） ============ -->
  <!-- 用户首次访问或未登录时显示的页面 -->
  <div class="auth-page" id="authPage" style="display:flex;">
    <div class="auth-card">
      <!-- Logo -->
      <div class="auth-logo">
        <svg viewBox="0 0 32 32" fill="none" width="40" height="40">
          <rect width="32" height="32" rx="8" fill="#5865f2"/>
          <path d="M8 24V8l8 8-8 8z" fill="white" fill-opacity="0.9"/>
          <path d="M16 24V8l8 8-8 8z" fill="white" fill-opacity="0.7"/>
        </svg>
        <span>BookReader</span>
      </div>
      <!-- 登录/注册标签切换按钮 -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-auth-tab="login" onclick="window._switchAuthTab?.(this)">登录</button>
        <button class="auth-tab" data-auth-tab="register" onclick="window._switchAuthTab?.(this)">注册</button>
      </div>
      <p class="login-error" id="authRegisterClosed" style="display:none;">注册已关闭</p>
      <!-- 登录表单 -->
      <form id="authLoginForm" onsubmit="event.preventDefault(); window._handleAuthSubmit?.('login')">
        <div class="form-group">
          <label for="authLoginEmail">邮箱</label>
          <input type="email" id="authLoginEmail" class="form-input" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="authLoginPass">密码</label>
          <input type="password" id="authLoginPass" class="form-input" placeholder="输入密码" autocomplete="current-password">
        </div>
        <p class="login-error" id="authError" style="display:none;"></p>
        <button type="submit" class="btn btn-primary btn-block">登录</button>
      </form>
      <!-- 注册表单 -->
      <form id="authRegisterForm" onsubmit="event.preventDefault(); window._handleAuthSubmit?.('register')" style="display:none;">
        <div class="form-group">
          <label for="authRegEmail">邮箱</label>
          <input type="email" id="authRegEmail" class="form-input" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="authRegPass">密码</label>
          <input type="password" id="authRegPass" class="form-input" placeholder="设置密码">
        </div>
        <p class="login-error" id="authErrorReg" style="display:none;"></p>
        <button type="submit" class="btn btn-primary btn-block">注册</button>
      </form>
    </div>
  </div>

  <!-- ============ 主应用容器（登录后可见） ============ -->
  <div class="app" id="authApp" style="display:none;">

    <!-- 侧边栏导航 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-inner">
        <!-- Logo 区域 -->
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="8" fill="#5865f2"/>
            <path d="M8 24V8l8 8-8 8z" fill="white" fill-opacity="0.9"/>
            <path d="M16 24V8l8 8-8 8z" fill="white" fill-opacity="0.7"/>
          </svg>
          <span class="logo-text">Webrary</span>
        </div>

        <!-- 侧边栏导航菜单：书架、历史、浏览、下载、设置、关于 -->
        <nav class="sidebar-nav" id="sidebarNav">
          <a class="nav-item active" data-page="shelf">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M22 4H2v16h20V4zM2 8h20"/>
              <path d="M7 4v16"/>
            </svg>
            <span>书架</span>
          </a>
          <a class="nav-item" data-page="history">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
            <span>历史</span>
          </a>
          <a class="nav-item" data-page="browse">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
            </svg>
            <span>浏览</span>
          </a>
          <a class="nav-item" data-page="downloads">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M12 3v12m0 0l-5-5m5 5l5-5"/><path d="M4 17v1a3 3 0 003 3h10a3 3 0 003-3v-1"/>
            </svg>
            <span>下载</span>
          </a>
          <a class="nav-item" data-page="settings">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
            </svg>
            <span>设置</span>
          </a>
          <a class="nav-item" data-page="about">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
            </svg>
            <span>关于</span>
          </a>
        </nav>
      </div>

      <!-- 侧边栏底部：用户信息与登录按钮 -->
      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebarUser">
          <span class="sidebar-user-email" id="userEmail"></span>
          <!-- 退出登录按钮 -->
          <button class="sidebar-user-logout" id="appLogoutBtn" title="退出登录" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
        <!-- 绑定 Z-Library 按钮 -->
        <button class="login-btn" id="loginBtn" title="绑定 Z-Library">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          <span>绑定 Z-Library</span>
        </button>
      </div>

      <!-- 移动端侧边栏切换按钮 -->
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>
    </aside>

    <!-- 主内容区域 -->
    <main class="main" id="mainContent">

      <!-- 顶部标题栏 -->
      <header class="header" id="header">
        <div class="header-left">
          <!-- 返回按钮 -->
          <button class="header-back-btn" id="headerBackBtn" style="display:none;" title="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
              <polyline points="15,18 9,12 15,6"/>
            </svg>
          </button>
          <h1 class="header-title" id="headerTitle">书架</h1>
          <span class="header-badge" id="totalBookCount">0</span>
        </div>
        <div class="header-actions">
          <!-- PWA 安装按钮（支持安装的浏览器才会显示） -->
          <button class="icon-btn" id="pwaInstallBtn" title="安装应用" style="display:none;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3v10m0 0l-4-4m4 4l4-4"></path>
              <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"></path>
            </svg>
          </button>
          <!-- 搜索按钮 -->
          <button class="icon-btn" id="searchBtn" title="搜索">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20">
              <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
            </svg>
          </button>
          <!-- 上传书籍按钮 -->
          <button class="icon-btn" id="uploadBtn" title="上传书籍">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path>
              <polyline points="16 16 12 12 8 16"></polyline>
              <line x1="12" y1="12" x2="12" y2="22"></line>
            </svg>
          </button>
          <!-- 刷新按钮 -->
          <button class="icon-btn" id="refreshBtn" title="刷新">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20">
              <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- 书架标签栏（Tab栏） -->
      <section class="tab-bar-wrapper">
        <div class="tab-bar" id="tabBar">
          <!-- 动态生成 -->
        </div>
        <!-- 新建书架按钮 -->
        <button class="tab-add-btn" id="addShelfBtn" title="新建书架">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </section>

       <!-- 书籍网格区域 -->
       <section class="books-container" id="booksContainer">
         <div class="books-grid" id="booksGrid">
          <!-- 动态生成 -->
        </div>
        <div class="browse-load-more" id="browseLoadMore" style="display:none;">
          <div class="spinner spinner-sm"></div>
        </div>

        <!-- 空状态：没有书籍时显示 -->
        <div class="empty-state" id="emptyState" style="display:none;">
          <div class="empty-state-kaomoji">(´・ω・｀)</div>
          <p>还没有书籍</p>
          <p class="text-muted">点击上方 + 搜索添加，或直接上传</p>
        </div>

        <!-- 加载状态 -->
        <div class="loading-state" id="loadingState">
          <div class="spinner"></div>
          <p>加载中...</p>
        </div>
      </section>

      <!-- ============ 书籍详情页 ============ -->
      <section class="detail-page" id="detailPage" style="display:none;">
        <div class="detail-content" id="detailContent">
          <!-- 左侧面板：封面、元数据、操作按钮 -->
          <div class="detail-left">
            <div class="detail-cover-wrapper">
              <img class="detail-cover" id="detailCover" src="" alt="">
            </div>
            <div class="detail-meta">
              <h1 class="detail-title" id="detailTitle"></h1>
              <p class="detail-author" id="detailAuthor"></p>
              <p class="detail-status" id="detailStatus"></p>
              <p class="detail-source" id="detailSource"></p>
            </div>
            <div class="detail-desc" id="detailDesc">
              <p class="detail-desc-text" id="detailDescText"></p>
              <!-- 展开更多按钮 -->
              <button class="detail-desc-more" id="detailDescMore" style="display:none;">查看更多</button>
            </div>
            <!-- 标签列表 -->
            <div class="detail-tags" id="detailTags"></div>
            <!-- 操作按钮组 -->
            <div class="detail-actions">
              <!-- 收藏按钮 -->
              <button class="detail-btn" id="detailFavBtn" title="收藏">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
                  <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
                </svg>
                <span>收藏</span>
              </button>
              <!-- 本地阅读按钮 -->
              <button class="detail-btn" id="detailLocalRead" title="本地阅读">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
                <span>本地阅读</span>
              </button>
              <!-- 在线阅读按钮（主要操作） -->
              <button class="detail-btn detail-btn-primary" id="detailReadOnline">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                  <polygon points="5,3 19,12 5,21"/>
                </svg>
                <span>在线阅读</span>
              </button>
              <!-- 下载到书架按钮 -->
              <button class="detail-btn" id="detailDownloadToShelf">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18">
                  <path d="M12 3v12m0 0l-5-5m5 5l5-5"/><path d="M4 17v1a3 3 0 003 3h10a3 3 0 003-3v-1"/>
                </svg>
                <span>下载到书架</span>
              </button>
            </div>
          </div>

          <!-- 右侧面板：目录列表 -->
          <div class="detail-right">
            <div class="toc-header">
              <span class="toc-title">目录 <span class="toc-count" id="tocCount">0</span>节</span>
              <div class="toc-header-actions">
                <!-- 目录搜索框 -->
                <div class="toc-search-wrapper">
                  <svg class="toc-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16">
                    <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                  </svg>
                  <input type="text" class="toc-search" id="tocSearch" placeholder="搜索目录...">
                </div>
                <!-- 目录排序按钮 -->
                <button class="toc-sort-btn" id="tocSortBtn" title="排序">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16">
                    <path d="M3 7h7M3 12h10M3 17h14"/>
                  </svg>
                </button>
              </div>
            </div>
            <!-- 目录列表 -->
            <div class="toc-list" id="tocList">
              <!-- 动态生成 -->
            </div>
          </div>
        </div>

        <!-- 继续阅读浮动按钮 (FAB) -->
        <button class="continue-reading-btn" id="continueReadingBtn" style="display:none;">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
            <polygon points="5,3 19,12 5,21"/>
          </svg>
          <span>继续阅读</span>
        </button>
      </section>

      <!-- ============ 设置页 ============ -->
      <section class="settings-page" id="settingsPage" style="display:none;">
        <div class="settings-card">
          <div class="settings-item">
            <div class="settings-item-label">允许注册</div>
            <label class="switch">
              <input type="checkbox" id="registrationToggle">
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ============ 自定义右键菜单 ============ -->
  <div class="context-menu" id="contextMenu" style="display:none;">
    <div class="context-menu-inner" id="contextMenuInner">
      <!-- 动态生成 -->
    </div>
  </div>

  <!-- ============ 搜索弹窗 ============ -->
  <div class="modal-overlay" id="searchModal" style="display:none;">
    <div class="modal search-modal">
      <div class="modal-header">
        <h2>搜索书籍</h2>
        <!-- 关闭按钮 -->
        <button class="modal-close" id="searchModalClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <!-- 搜索输入框 -->
        <div class="search-input-group">
          <input type="text" class="search-input" id="searchQuery" placeholder="输入书名或作者..." autocomplete="off">
          <button class="btn btn-primary" id="searchSubmitBtn">搜索</button>
        </div>

        <!-- 高级筛选区域 -->
        <div class="search-filters" id="searchFilters">
          <details class="filter-group">
            <summary>高级筛选</summary>
            <div class="filter-grid">
              <div class="filter-field">
                <label>起始年份</label>
                <input type="number" id="filterYearFrom" placeholder="如 2000">
              </div>
              <div class="filter-field">
                <label>结束年份</label>
                <input type="number" id="filterYearTo" placeholder="如 2024">
              </div>
              <div class="filter-field">
                <label>语言</label>
                <select id="filterLanguage">
                  <option value="">全部</option>
                  <option value="chinese">中文</option>
                  <option value="english">English</option>
                  <option value="japanese">日本語</option>
                  <option value="korean">한국어</option>
                </select>
              </div>
              <div class="filter-field">
                <label>格式</label>
                <select id="filterExtension">
                  <option value="">全部</option>
                  <option value="pdf">PDF</option>
                  <option value="epub">EPUB</option>
                  <option value="mobi">MOBI</option>
                  <option value="azw3">AZW3</option>
                </select>
              </div>
              <div class="filter-field">
                <label>排序</label>
                <select id="filterOrder">
                  <option value="">最佳匹配</option>
                  <option value="popular">最受欢迎</option>
                  <option value="year">最新（按年份）</option>
                  <option value="title">标题 A-Z</option>
                  <option value="filesize">文件大小</option>
                </select>
              </div>
            </div>
          </details>
        </div>

        <!-- 搜索结果列表 -->
        <div class="search-results" id="searchResults">
          <div class="search-empty">输入关键词开始搜索</div>
        </div>

        <!-- 搜索加载状态 -->
        <div class="search-loading" id="searchLoading" style="display:none;">
          <div class="spinner"></div>
          <p>搜索中...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 上传书籍弹窗 ============ -->
  <div class="modal-overlay" id="uploadModal" style="display:none;">
    <div class="modal upload-modal">
      <div class="modal-header">
        <h2>上传书籍</h2>
        <!-- 关闭按钮 -->
        <button class="modal-close" id="uploadModalClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <!-- 拖拽上传区域 -->
        <div class="upload-dropzone" id="uploadDropzone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" width="48" height="48" opacity="0.4">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <path d="M12 18v-6M9 15l3-3 3 3"/>
          </svg>
          <p>拖拽文件到此处或点击选择</p>
          <p class="text-muted" id="uploadFileName"></p>
          <input type="file" id="uploadFileInput" accept=".epub,.pdf,.mobi,.azw3,.txt" style="display:none;">
        </div>

        <div class="form-group">
          <label for="uploadTitle">书名</label>
          <input type="text" id="uploadTitle" class="form-input" placeholder="输入书名">
        </div>

        <div class="form-group">
          <label for="uploadAuthor">作者</label>
          <input type="text" id="uploadAuthor" class="form-input" placeholder="输入作者">
        </div>

        <div class="form-group">
          <label for="uploadShelf">目标书架</label>
          <select id="uploadShelf" class="form-input">
            <!-- 动态生成 -->
          </select>
        </div>

        <!-- 上传提交按钮 -->
        <button class="btn btn-primary btn-block" id="uploadSubmitBtn">
          <span id="uploadSubmitText">上传到书架</span>
          <div class="spinner spinner-sm" id="uploadSpinner" style="display:none;"></div>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ 登录 Z-Library 弹窗 ============ -->
  <div class="modal-overlay" id="loginModal" style="display:none;">
    <div class="modal login-modal">
      <div class="modal-header">
        <h2>登录 Z-Library</h2>
        <!-- 关闭按钮 -->
        <button class="modal-close" id="loginModalClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="loginEmail">邮箱</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label for="loginPassword">密码</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="输入密码">
        </div>
        <div class="form-group">
          <label for="loginDomain">域名 (可选)</label>
          <input type="text" id="loginDomain" class="form-input" placeholder="如 singlelogin.re">
        </div>
        <!-- 代理设置 -->
        <div class="form-group">
          <details class="proxy-details">
            <summary>代理设置 (可选)</summary>
            <div class="proxy-row">
              <input type="text" id="loginProxyHost" class="form-input" placeholder="代理地址, 如 127.0.0.1">
              <input type="number" id="loginProxyPort" class="form-input" placeholder="端口, 如 7890" style="max-width:120px;">
            </div>
          </details>
        </div>
        <!-- 登录提交按钮 -->
        <button class="btn btn-primary btn-block" id="loginSubmitBtn">
          <span id="loginSubmitText">登录</span>
          <div class="spinner spinner-sm" id="loginSpinner" style="display:none;"></div>
        </button>
        <p class="login-error" id="loginError" style="display:none;"></p>
      </div>
    </div>
  </div>

  <!-- ============ 重命名书架弹窗 ============ -->
  <div class="modal-overlay" id="renameModal" style="display:none;">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>重命名书架</h2>
        <!-- 关闭按钮 -->
        <button class="modal-close" id="renameModalClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="renameInput">新名称</label>
          <input type="text" id="renameInput" class="form-input" placeholder="输入新名称">
        </div>
        <!-- 保存按钮 -->
        <button class="btn btn-primary btn-block" id="renameSubmitBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- ============ 下载到书架弹窗（多选书架） ============ -->
  <div class="modal-overlay" id="downloadShelfModal" style="display:none;">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>下载到书架</h2>
        <!-- 关闭按钮 -->
        <button class="modal-close" id="downloadShelfModalClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <!-- 书架多选列表 -->
        <div class="shelf-checkbox-list" id="shelfCheckboxList">
          <!-- 动态生成 -->
        </div>
        <!-- 确认按钮 -->
        <button class="btn btn-primary btn-block" id="downloadShelfConfirmBtn">添加到已选书架</button>
      </div>
    </div>
  </div>

  <!-- ============ Toast 通知容器 ============ -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/app.js"></script>
</body>
</html>
