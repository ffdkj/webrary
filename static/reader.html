<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Reader — BookReader</title>
  <meta name="theme-color" content="#080808">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Webrary">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icons/webrary.svg">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="/js/pwa.js" defer></script>
  <style>
    /* ==========================================================
       阅读器 — CSS 自定义变量与基础重置
       ========================================================== */
    :root {
      --bg: #080808;
      --surface: #121212;
      --surface-elevated: #1a1a1a;
      --primary: #5865f2;
      --accent: #e7c785;
      --text: #d4d4d4;
      --text-heading: #ffffff;
      --muted: #888888;
      --muted-dark: #555555;
      --border: #2a2a2a;
      --border-light: #333333;
      --danger: #ef4444;
      --radius: 8px;
      --radius-sm: 4px;
      --radius-lg: 12px;
      --transition: 0.2s ease;
      --transition-slow: 0.3s ease;
      --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
      --font-reading: 'Noto Serif SC', 'Georgia', 'Times New Roman', serif;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      font-family: inherit;
      font-size: inherit;
      border: none;
      background: none;
      color: inherit;
      cursor: pointer;
    }

    a { color: inherit; text-decoration: none; }

    /* 滚动条样式 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted-dark); }

    /* ==========================================================
       布局
       ========================================================== */
    .app {
      display: block;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* ==========================================================
       顶部工具栏
       ========================================================== */
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: calc(48px + var(--sat));
      padding: var(--sat) calc(12px + var(--sar)) 0 calc(12px + var(--sal));
      background: rgba(8, 8, 8, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      gap: 8px;
      transform: translateY(0);
      transition: transform var(--transition-slow), opacity var(--transition-slow);
    }

    .toolbar.hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .toolbar-left,
    .toolbar-center,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .toolbar-left { flex: 0 0 auto; }
    .toolbar-center { flex: 1; justify-content: center; min-width: 0; overflow: hidden; }
    .toolbar-right { flex: 0 0 auto; }

    .toolbar-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: var(--radius);
      color: var(--muted);
      transition: all var(--transition);
      position: relative;
    }
    .toolbar-btn:hover { color: var(--text); background: var(--surface); }
    .toolbar-btn:active { background: var(--surface-elevated); }
    .toolbar-btn.active { color: var(--accent); }

    .toolbar-btn svg {
      width: 20px;
      height: 20px;
    }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 4px;
    }

    .toolbar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-heading);
      letter-spacing: -0.01em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    .toolbar-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-left: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 1;
    }

    .font-size-display {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      min-width: 32px;
      text-align: center;
      user-select: none;
    }

    .page-indicator {
      display: none;
      font-size: 12px;
      color: var(--muted);
      min-width: 56px;
      text-align: center;
      white-space: nowrap;
      user-select: none;
    }

    /* ==========================================================
       摘抄荧光笔
       ========================================================== */
    .highlight-popup {
      position: fixed;
      z-index: 400;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px;
      background: var(--surface-elevated);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
    }

    .hl-swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.18);
      cursor: pointer;
      transition: transform var(--transition);
    }
    .hl-swatch:hover {
      transform: scale(1.15);
    }
    .hl-swatch[data-color="yellow"] { background: #f6c945; }
    .hl-swatch[data-color="green"] { background: #7ed68a; }
    .hl-swatch[data-color="blue"] { background: #7fb6f2; }
    .hl-swatch[data-color="pink"] { background: #f28fb4; }

    .reader-toast {
      position: fixed;
      top: calc(16px + var(--sat));
      right: calc(16px + var(--sar));
      z-index: 1200;
      max-width: 320px;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .reader-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    mark.hl-yellow {
      background: rgba(255, 213, 79, 0.42);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }
    mark.hl-green {
      background: rgba(129, 199, 132, 0.42);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }
    mark.hl-blue {
      background: rgba(144, 202, 249, 0.42);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }
    mark.hl-pink {
      background: rgba(244, 143, 177, 0.42);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }

    .sidebar-tabs {
      display: flex;
      gap: 4px;
      padding: 3px;
      background: var(--surface-elevated);
      border-radius: var(--radius);
    }
    .sidebar-tab {
      padding: 6px 12px;
      font-size: 13px;
      color: var(--muted);
      border-radius: 6px;
      transition: all var(--transition);
    }
    .sidebar-tab.active {
      background: var(--primary);
      color: #ffffff;
    }

    .highlight-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      padding: 12px 20px;
      text-align: left;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }
    .highlight-item:hover {
      background: var(--surface-elevated);
    }
    .hl-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 5px;
    }
    .highlight-quote {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .highlight-loc {
      flex-shrink: 0;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .highlight-delete {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: all var(--transition);
      cursor: pointer;
    }
    .highlight-delete:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.12);
    }

    /* ==========================================================
       主阅读区域
       ========================================================== */
    .reader-area {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--surface);
      touch-action: pan-y;
      overscroll-behavior-x: none;
    }

    /* EPUB 阅读器 — epub.js 在 #viewer 内渲染一个 iframe */
    #viewer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #121212;
    }

    #viewer iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
      background: #121212;
      touch-action: pan-y;
    }

    .reader-tap-layer {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: none;
    }

    .reader-tap-layer.active {
      display: flex;
    }

    .reader-tap-zone {
      flex: 0 0 30%;
      -webkit-tap-highlight-color: transparent;
    }

    .reader-tap-zone.tap-toggle {
      flex: 1 1 auto;
    }

    /* PDF 阅读容器 */
    .pdf-container {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: calc(24px + var(--sat)) 0 calc(24px + var(--sab));
      gap: 16px;
      background: #1a1a1a;
    }

    .pdf-page {
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
      border-radius: 2px;
      background: #ffffff;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .pdf-page canvas {
      display: block;
      border-radius: 2px;
    }

    .pdf-page.pdf-saved {
      outline: 3px solid rgba(144, 202, 249, 0.95);
      outline-offset: -3px;
    }

    /* TXT 阅读器 */
    .txt-reader {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: calc(48px + var(--sat)) calc(80px + var(--sar)) calc(48px + var(--sab)) calc(80px + var(--sal));
      font-family: var(--font-reading);
      font-size: 18px;
      line-height: 1.85;
      color: #d4d4d4;
      background: #0d0d0d;
      max-width: 820px;
      margin: 0 auto;
    }

    .txt-chapter-header {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      margin: 32px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      letter-spacing: 0.02em;
    }

    .txt-paragraph {
      margin-bottom: 16px;
      text-indent: 2em;
      text-align: justify;
    }

    /* ==========================================================
       目录侧边栏
       ========================================================== */
    .toc-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 199;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-slow);
    }
    .toc-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .toc-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 300px;
      height: 100dvh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 200;
      transform: translateX(100%);
      transition: transform var(--transition-slow);
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 32px rgba(0, 0, 0, 0.5);
    }
    .toc-sidebar.open {
      transform: translateX(0);
    }

    .toc-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(16px + var(--sat)) 20px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .toc-sidebar-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-heading);
    }

    .toc-sidebar-close {
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: all var(--transition);
    }
    .toc-sidebar-close:hover {
      color: var(--text);
      background: var(--surface-elevated);
    }

    .toc-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0 calc(12px + var(--sab));
    }

    .toc-item {
      display: block;
      width: 100%;
      padding: 10px 20px;
      font-size: 13px;
      color: var(--muted);
      text-align: left;
      transition: all var(--transition);
      border-left: 3px solid transparent;
      cursor: pointer;
      line-height: 1.5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toc-item:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
    }

    .toc-item.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: rgba(231, 199, 133, 0.06);
    }

    .toc-item.toc-sub {
      padding-left: 40px;
      font-size: 12px;
    }

    /* ==========================================================
       加载动画
       ========================================================== */
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--bg);
      z-index: 300;
      transition: opacity var(--transition-slow);
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      color: var(--muted);
    }

    /* ==========================================================
       错误页面
       ========================================================== */
    .error-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--bg);
      z-index: 250;
    }

    .error-icon {
      font-size: 48px;
      opacity: 0.5;
    }

    .error-message {
      font-size: 16px;
      color: var(--danger);
      text-align: center;
      max-width: 400px;
      line-height: 1.6;
    }

    .error-back-btn {
      padding: 10px 24px;
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      border: 1px solid var(--border);
      transition: all var(--transition);
    }
    .error-back-btn:hover {
      background: var(--surface-elevated);
      border-color: var(--border-light);
    }

    /* ==========================================================
       响应式布局
       ========================================================== */
    @media (max-width: 800px) {
      .toolbar-subtitle { display: none; }
      .toc-sidebar { width: 280px; }
      .txt-reader { padding: calc(32px + var(--sat)) 24px calc(32px + var(--sab)); font-size: 16px; }
    }

    @media (max-width: 480px) {
      .toolbar { padding: var(--sat) calc(8px + var(--sar)) 0 calc(8px + var(--sal)); }
      .toolbar-center { display: none; }
      .toc-sidebar { width: 100%; }
      .pdf-container { padding: calc(8px + var(--sat)) 0 calc(8px + var(--sab)); gap: 8px; }
      .txt-reader { padding: calc(24px + var(--sat)) 16px calc(24px + var(--sab)); }
    }

    /* ==========================================================
       设置弹窗
       ========================================================== */
    .settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 299;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-slow);
    }
    .settings-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .settings-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 300;
      width: 820px;
      height: 700px;
      max-width: 95vw;
      max-height: 80vh;
      background: #303340;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }

    /* 设置标签页 */
    .settings-tabs {
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    .settings-tab {
      padding: 14px 0;
      font-size: 14px;
      font-weight: 500;
      color: #b0b4c5;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all var(--transition);
      margin-right: 32px;
    }
    .settings-tab.active {
      color: #6d8cff;
      border-bottom-color: #6d8cff;
    }
    .settings-tab:hover:not(.active) {
      color: #d0d4e0;
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 0;
      flex-shrink: 0;
    }

    .settings-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }

    .settings-close {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b0b4c5;
      cursor: pointer;
      transition: all var(--transition);
    }
    .settings-close:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }

    .settings-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px calc(32px + var(--sab));
    }

    .settings-content::-webkit-scrollbar { width: 4px; }
    .settings-content::-webkit-scrollbar-track { background: transparent; }
    .settings-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .settings-section-title {
      font-size: 14px;
      font-weight: 600;
      color: #b8bdd0;
      margin-bottom: 12px;
    }

    .settings-section {
      margin-bottom: 28px;
    }

    .option-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .option-btn {
      height: 36px;
      padding: 0 18px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      color: #b8bdd0;
      background: transparent;
      border: 1px solid #48506a;
      cursor: pointer;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .option-btn:hover {
      border-color: #667cff;
      color: #d0d4e0;
    }
    .option-btn.selected {
      background: #667cff;
      border-color: #667cff;
      color: #ffffff;
    }

    .option-btn .option-icon {
      font-size: 15px;
      line-height: 1;
    }

    .preload-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .preload-input {
      width: 64px;
      height: 36px;
      padding: 0 10px;
      border-radius: 4px;
      border: 1px solid #48506a;
      background: #252836;
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      text-align: center;
      outline: none;
      transition: border-color var(--transition);
      -moz-appearance: textfield;
    }
    .preload-input::-webkit-inner-spin-button,
    .preload-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .preload-input:focus {
      border-color: #667cff;
    }

    .preload-hint {
      font-size: 12px;
      color: #7d849b;
    }

    @media (max-width: 860px) {
      .settings-modal {
        top: 0;
        left: 0;
        transform: none;
        width: 100%;
        height: 100dvh;
        max-width: 100vw;
        max-height: 100dvh;
        border-radius: 0;
      }
    }

    /* PWA 离线功能：网络状态 + 离线徽标 + 缓存按钮状态 */
    .net-status {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      color: #22c55e;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      white-space: nowrap;
      user-select: none;
    }
    .net-status.offline {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.35);
    }
    .offline-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: #7fb6f2;
      background: rgba(127, 182, 242, 0.12);
      border: 1px solid rgba(127, 182, 242, 0.4);
      white-space: nowrap;
    }
    #cacheBookBtn.active {
      color: #22c55e;
      background: rgba(34, 197, 94, 0.12);
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- ===== 顶部工具栏 ===== -->
    <header class="toolbar" id="toolbar">
      <div class="toolbar-left">
        <!-- 返回书架按钮 -->
        <a class="toolbar-btn" href="/index.html" title="返回书架">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15,18 9,12 15,6"/>
          </svg>
        </a>
      </div>

      <div class="toolbar-center">
        <span class="toolbar-title" id="toolbarTitle">加载中...</span>
        <span class="toolbar-subtitle" id="toolbarAuthor"></span>
      </div>

      <div class="toolbar-right">
        <!-- 目录按钮 -->
        <button class="toolbar-btn" id="tocBtn" title="目录" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <button class="toolbar-btn" id="highlightsBtn" title="摘抄" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 3H5a2 2 0 00-2 2v14a2 2 0 002 2h3M16 3h3a2 2 0 012 2v14a2 2 0 01-2 2h-3"/>
            <path d="M12 5l2 4 4 .6-3 2.8.8 4.2-3.8-2.2L8.2 16.6 9 12.4 6 9.6 10 9z"/>
          </svg>
        </button>
        <span class="toolbar-divider"></span>

        <!-- 阅读设置按钮 -->
        <button class="toolbar-btn" id="settingsBtn" title="阅读设置">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"></path>
          </svg>
        </button>
        <span class="toolbar-divider"></span>

        <!-- 缩小字体按钮 -->
        <button class="toolbar-btn" id="fontSizeDown" title="缩小字体">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M5 12h14"/>
          </svg>
        </button>
        <span class="font-size-display" id="fontSizeDisplay">16</span>
        <!-- 放大字体按钮 -->
        <button class="toolbar-btn" id="fontSizeUp" title="放大字体">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>

        <span class="toolbar-divider"></span>

        <!-- 缓存到本地按钮（仅非 PDF 显示；已缓存时变为勾选态） -->
        <button class="toolbar-btn" id="cacheBookBtn" title="缓存到本地（离线阅读）" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
        <!-- 离线模式徽标（正在读取 OPFS 本地缓存） -->
        <span class="offline-badge" id="offlineBadge" style="display:none;">离线缓存</span>
        <!-- 网络状态 -->
        <span class="net-status net-status-reader" id="netStatus" title="网络状态">在线</span>

        <span class="toolbar-divider" id="pageDivider"></span>

        <!-- 上一页按钮 -->
        <button class="toolbar-btn" id="pagePrevBtn" title="上一页" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="15,18 9,12 15,6"/>
          </svg>
        </button>
        <!-- 下一页按钮 -->
        <button class="toolbar-btn" id="pageNextBtn" title="下一页" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="9,18 15,12 9,6"/>
          </svg>
        </button>
        <span class="page-indicator" id="pageIndicator"></span>
      </div>
    </header>

    <!-- ===== 阅读区域 ===== -->
    <div class="reader-area" id="readerArea">
      <!-- epub.js 在此 div 内渲染 iframe -->
      <div id="viewer"></div>

      <!-- 加载覆盖层 -->
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <span class="loading-text">加载中...</span>
      </div>

      <!-- 错误状态（默认隐藏） -->
      <div class="error-state" id="errorState" style="display:none;">
        <div class="error-icon">⚠️</div>
        <p class="error-message" id="errorMessage"></p>
        <a class="error-back-btn" href="/index.html">返回书架</a>
      </div>
    </div>

    <!-- ===== 目录遮罩与侧边栏 ===== -->
    <div class="toc-overlay" id="tocOverlay"></div>
    <aside class="toc-sidebar" id="tocSidebar">
      <div class="toc-sidebar-header">
        <div class="sidebar-tabs">
          <button class="sidebar-tab active" id="tocTabBtn" data-panel="toc">目录</button>
          <button class="sidebar-tab" id="highlightsTabBtn" data-panel="highlights">摘抄</button>
        </div>
        <!-- 关闭目录按钮 -->
        <button class="toc-sidebar-close" id="tocClose" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="toc-list" id="tocList">
        <span class="loading-text" style="display:block;padding:20px;">暂无目录</span>
      </div>
      <div class="toc-list" id="highlightsList" style="display:none;">
        <span class="loading-text" style="display:block;padding:20px;">暂无摘抄</span>
      </div>
    </aside>

    <!-- ===== 摘抄颜色弹窗 ===== -->
    <div class="highlight-popup" id="highlightPopup">
      <button class="hl-swatch" data-color="yellow" title="黄色"></button>
      <button class="hl-swatch" data-color="green" title="绿色"></button>
      <button class="hl-swatch" data-color="blue" title="蓝色"></button>
      <button class="hl-swatch" data-color="pink" title="粉色"></button>
    </div>

    <!-- ===== 阅读设置弹窗 ===== -->
    <!-- ===== 右上角提示 ===== -->
    <div class="reader-toast" id="readerToast"></div>

    <div class="settings-overlay" id="settingsOverlay"></div>
    <div class="settings-modal" id="settingsModal" style="display:none;">
      <!-- 设置标签页 -->
      <div class="settings-tabs">
        <button class="settings-tab active">阅读模式</button>
        <div style="flex:1;"></div>
        <!-- 关闭设置按钮 -->
        <button class="settings-close" id="settingsClose" title="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="settings-content">
        <!-- 阅读模式（仅PDF有效） -->
        <div class="settings-section">
          <div class="settings-section-title">阅读模式（PDF有效）</div>
          <div class="option-group" id="readingModeGroup">
            <button class="option-btn selected" data-value="single">单页</button>
            <button class="option-btn" data-value="double">双页</button>
          </div>
        </div>

        <!-- 页面适配 -->
        <div class="settings-section">
          <div class="settings-section-title">页面适配</div>
          <div class="option-group" id="pageFitGroup">
            <button class="option-btn selected" data-value="width">
              <span class="option-icon">↔</span> 适配宽度
            </button>
            <button class="option-btn" data-value="height">
              <span class="option-icon">↕</span> 适配高度
            </button>
          </div>
        </div>

        <!-- 预加载设置 -->
        <div class="settings-section">
          <div class="settings-section-title">预加载（PDF有效）</div>
          <div class="preload-row">
            <input type="number" class="preload-input" id="preloadInput" min="0" max="10" value="3">
            <span class="preload-hint">0~10 页，提前缓存以提升翻页流畅度</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 第三方库脚本（加载顺序重要：JSZip 在 epub.js 之前） ===== -->
  <script src="/vendor/jszip.min.js"></script>
  <script src="/vendor/epub.min.js"></script>

  <!-- ===== 阅读器逻辑脚本（epub.js 全局暴露 ePub 对象） ===== -->
  <script src="/js/txt-pagination.js"></script>
  <script src="/js/opfs-cache.js"></script>
  <script src="/js/reader.js?v=20260815-4"></script>
</body>
</html>
